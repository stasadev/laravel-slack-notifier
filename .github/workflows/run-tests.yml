name: run-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per PHP and Laravel pair. Composer picks the matching
        # orchestra/testbench and phpunit/phpunit from the require-dev constraints.
        include:
          - { php: '7.1', laravel: '5.7.*' }
          - { php: '7.2', laravel: '5.7.*' }
          - { php: '7.3', laravel: '5.7.*' }

          - { php: '7.1', laravel: '5.8.*' }
          - { php: '7.2', laravel: '5.8.*' }
          - { php: '7.3', laravel: '5.8.*' }
          - { php: '7.4', laravel: '5.8.*' }

          - { php: '7.2', laravel: '6.*' }
          - { php: '7.3', laravel: '6.*' }
          - { php: '7.4', laravel: '6.*' }
          - { php: '8.0', laravel: '6.*' }

          - { php: '7.2', laravel: '7.*' }
          - { php: '7.3', laravel: '7.*' }
          - { php: '7.4', laravel: '7.*' }
          - { php: '8.0', laravel: '7.*' }

          - { php: '7.3', laravel: '8.*' }
          - { php: '7.4', laravel: '8.*' }
          - { php: '8.0', laravel: '8.*' }
          - { php: '8.1', laravel: '8.*' }

          - { php: '8.0', laravel: '9.*' }
          - { php: '8.1', laravel: '9.*' }
          - { php: '8.2', laravel: '9.*' }

          - { php: '8.1', laravel: '10.*' }
          - { php: '8.2', laravel: '10.*' }
          - { php: '8.3', laravel: '10.*' }

          - { php: '8.2', laravel: '11.*' }
          - { php: '8.3', laravel: '11.*' }
          - { php: '8.4', laravel: '11.*' }

          - { php: '8.2', laravel: '12.*' }
          - { php: '8.3', laravel: '12.*' }
          - { php: '8.4', laravel: '12.*' }
          - { php: '8.5', laravel: '12.*' }
          # Laravel 12 does not support PHP 8.6, its container calls the deprecated
          # spl_object_hash(), and the printed deprecations make tests risky.
          # - { php: '8.6', laravel: '12.*' }

          - { php: '8.3', laravel: '13.*' }
          - { php: '8.4', laravel: '13.*' }
          - { php: '8.5', laravel: '13.*' }
          - { php: '8.6', laravel: '13.*' }

    name: P${{ matrix.php }} - L${{ matrix.laravel }}

    env:
      # Old Laravel versions have known security advisories, and Composer
      # refuses to install them by default. That is fine for running tests.
      COMPOSER_NO_BLOCKING: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          # Carbon 1 (Laravel 5.7) ships this Composer plugin, which only prints an upgrade notice.
          composer config allow-plugins.kylekatarnls/update-helper false
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: List installed dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/phpunit
